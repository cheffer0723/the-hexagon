name: Deploy The Hexagon to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
        env:
          # The canonical deployment is the apex custom domain. Keep asset URLs
          # rooted at / so instance6.xyz serves the built bundle correctly.
          BASE_PATH: /
          VITE_HEXAGON_API_BASE_URL: ${{ vars.HEXAGON_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify deployed Hexagon without an OpenAI charge
        env:
          HEXAGON_API_URL: ${{ vars.HEXAGON_API_BASE_URL }}
          HEXAGON_WEB_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run smoke
